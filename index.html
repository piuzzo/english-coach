<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Coach</title>
  <meta name="description" content="Allenamento di inglese per la prima superiore">
  <meta name="theme-color" content="#5b4fe9">
  <!-- iPad/iPhone: "Aggiungi alla schermata Home" la apre come un'app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="English Coach">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <script>
    // il manifest serve solo quando l'app è online (su file:// il browser lo rifiuterebbe)
    // (non quando si apre un link di collegamento: su iPad la schermata Home deve salvare il link completo)
    if (/^https?:$/.test(location.protocol) && !/collega=/.test(location.hash)) {
      var m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest';
      document.head.appendChild(m);
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-nav="home" type="button" aria-label="Torna alla home">
      <span class="brand-mark" aria-hidden="true">EC</span>
      <span class="brand-name">English Coach</span>
    </button>
    <span class="topbar-level" id="topbar-level"></span>
  </header>

  <main id="app" class="app" tabindex="-1">
    <noscript>Per usare English Coach serve JavaScript attivo nel browser.</noscript>
  </main>

  <!-- L'ordine conta. tests/load.js legge questa lista per caricare gli stessi file in Node. -->
  <script src="js/core.js"></script>
  <script src="data/topics.js"></script>
  <script src="data/grammar-a1.js"></script>
  <script src="data/grammar-a1b.js"></script>
  <script src="data/grammar-a2.js"></script>
  <script src="data/grammar-a2b.js"></script>
  <script src="data/grammar-b1.js"></script>
  <script src="data/grammar-b1plus.js"></script>
  <script src="data/vocab.js"></script>
  <script src="data/reading.js"></script>
  <script src="data/writing.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/learner.js"></script>
  <script src="js/placement.js"></script>
  <script src="js/session.js"></script>
  <script src="js/writing.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/report.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
